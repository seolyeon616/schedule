<!doctype html><html><head><meta charset="utf-8">
<!-- FILM03 STRAWBERRY MOON × 달토끼 제과점 — 9:16 자막·타이틀·로고 오버레이 (1080x1920, 투명) -->
<link rel="stylesheet" href="node_modules/@fontsource/do-hyeon/index.css">
<link rel="stylesheet" href="node_modules/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="node_modules/@fontsource-variable/fraunces/full.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;-webkit-font-smoothing:antialiased}
section{width:1080px;height:1920px;position:relative;overflow:hidden}
.cap{position:absolute;font-family:'Do Hyeon';font-size:70px;line-height:1.22;color:#fff;letter-spacing:-.005em;
  text-shadow:0 0 18px rgba(255,190,220,.55),0 0 42px rgba(255,150,200,.30),0 3px 12px rgba(30,8,30,.65),0 0 3px rgba(30,8,30,.5)}
.fr{font-family:'Fraunces Variable';font-weight:900;font-variation-settings:'SOFT' 100,'WONK' 1}
.yellow{fill:#FFD84D}
.band{position:absolute;left:0;right:0;top:1180px;height:400px;
  background:linear-gradient(to bottom,transparent,rgba(25,12,28,.30) 40%,rgba(25,12,28,.30) 60%,transparent)}
.band.strong{background:linear-gradient(to bottom,transparent,rgba(30,14,30,.55) 40%,rgba(30,14,30,.55) 62%,transparent)}
/* 설명 자막: 영화 대사 자막 스타일 (가운데 · 아래 · 보통 굵기 · 그림자만) */
.sub{position:absolute;left:70px;right:70px;top:1338px;text-align:center;font-family:Pretendard;font-weight:500;
  font-size:50px;line-height:1.42;letter-spacing:-.01em;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.75),0 2px 8px rgba(0,0,0,.55),0 0 22px rgba(0,0,0,.35)}
svg text{paint-order:stroke}
</style></head><body>

<template id="rabbit"><!-- 초승달 + 토끼 귀 심볼 -->
<svg viewBox="0 0 120 120" width="100%" height="100%">
  <defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <g filter="url(#g)">
    <path d="M78 96a42 42 0 1 1 0-72a34 34 0 1 0 0 72z" fill="#FFD84D"/>
    <path d="M70 30c-6-14-4-26 2-28c6-1 9 12 6 28z" fill="#FFE9F1"/>
    <path d="M82 32c0-15 5-26 11-25c6 2 4 15-4 27z" fill="#FFE9F1"/>
    <path d="M73 27c-3-9-2-17 1-18c3 0 4 8 3 18z" fill="#F7A7C4"/>
    <path d="M85 29c1-10 4-17 7-16c3 1 1 9-3 17z" fill="#F7A7C4"/>
    <circle cx="96" cy="22" r="2.4" fill="#fff"/><circle cx="104" cy="44" r="1.6" fill="#fff"/>
  </g>
</svg></template>

<!-- #1 밤거리 · 딸기 달 (사람은 아래, 달은 위 → 가운데 왼쪽) -->
<section id="cap1"><div class="cap" style="left:0;right:0;top:1355px;text-align:center">오늘 밤,<br>달이 좀 이상하지 않아?</div></section>
<!-- #2 별똥별 (하늘 → 오른쪽 위) -->
<section id="cap2"><div class="cap" style="left:0;right:0;top:330px;text-align:center">어? 달에서<br>딸기 한 알이 떨어졌어!</div></section>
<!-- #3 카페 창 (창은 위·가운데 → 아래 왼쪽) -->
<section id="cap3"><div class="cap" style="left:0;right:0;top:1360px;text-align:center">그 딸기가<br>찾아간 곳은…</div></section>

<!-- #4 케이크 위 타이틀 (베라 'WHAT YOU WANT' 스타일 아치) -->
<section id="title">
  <svg width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
    <defs>
      <path id="arc" d="M60 360 Q540 90 1020 360"/>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <g filter="url(#glow)">
      <text class="fr yellow" font-size="112" text-anchor="middle" stroke="#7A2140" stroke-width="10" stroke-linejoin="round" style="font-family:'Fraunces Variable';font-weight:900;font-variation-settings:'SOFT' 100,'WONK' 1">
        <textPath href="#arc" startOffset="50%">STRAWBERRY</textPath></text>
      <text x="540" y="452" class="fr yellow" font-size="128" text-anchor="middle" stroke="#7A2140" stroke-width="10" stroke-linejoin="round" style="font-family:'Fraunces Variable';font-weight:900;font-variation-settings:'SOFT' 100,'WONK' 1">MOON</text>
    </g>
    <text x="540" y="1500" font-size="56" text-anchor="middle" fill="#fff" style="font-family:'Do Hyeon';filter:drop-shadow(0 0 12px rgba(255,150,200,.6))">달빛 딸기 생크림 케이크 · 스트로베리문</text>
  </svg>
</section>

<!-- #5 단면 (아래 왼쪽) -->
<section id="cap5"><div class="cap" style="left:84px;top:300px;text-align:left">달빛을 가득 품은<br>딸기 생크림 케이크</div></section>

<!-- 엔딩 로고: 달토끼 제과점 -->
<section id="endlogo" style="background:radial-gradient(ellipse 80% 40% at 50% 46%,rgba(30,12,40,.45),rgba(30,12,40,.12) 70%,transparent)">
  <div style="position:absolute;left:0;right:0;top:560px;display:flex;flex-direction:column;align-items:center">
    <span data-sym style="width:190px;height:190px;display:block"></span>
    <svg width="1080" height="250" viewBox="0 0 1080 250" style="margin-top:-6px">
      <defs><path id="arc2" d="M60 225 Q540 10 1020 225"/>
        <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      <text font-size="110" text-anchor="middle" fill="#FFD84D" stroke="#7A2140" stroke-width="9" stroke-linejoin="round" filter="url(#glow2)" style="paint-order:stroke;font-family:'Fraunces Variable';font-weight:900;font-variation-settings:'SOFT' 100,'WONK' 1"><textPath href="#arc2" startOffset="50%">MOON RABBIT</textPath></text>
    </svg>
    <div class="fr" style="font-size:66px;color:#FFE9F1;letter-spacing:.32em;margin-right:-.32em;margin-top:-18px;text-shadow:0 0 20px rgba(255,150,200,.6)">BAKERY</div>
    <div style="font-family:'Do Hyeon';font-size:64px;color:#fff;margin-top:26px;text-shadow:0 0 18px rgba(255,170,210,.6)">달토끼 제과점</div>
    <div style="font-family:'Do Hyeon';font-size:46px;color:rgba(255,255,255,.92);margin-top:34px;text-shadow:0 0 16px rgba(255,150,200,.55),0 2px 8px rgba(40,10,40,.4)">매일 밤, 달이 뜨면 문을 열어요</div>
  </div>
</section>

<script>const t=document.getElementById('rabbit').innerHTML;document.querySelectorAll('[data-sym]').forEach(s=>s.innerHTML=t);</script>
</body></html>
