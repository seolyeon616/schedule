<!doctype html><html><head><meta charset="utf-8">
<!-- FILM05 GRWM × MULGYUL — 매거진 뷰티 인터뷰 스타일 자막 (1080x1920, 투명)
     Q = 화면 밖 인터뷰어 질문 (디돈 세리프 이탤릭 + 명조), A = 하루의 대답 (명조 굵게) -->
<style>
@font-face{font-family:"Bodoni";font-weight:400;src:url(node_modules/@fontsource/bodoni-moda/files/bodoni-moda-latin-400-normal.woff2)}
@font-face{font-family:"Bodoni";font-weight:400;font-style:italic;src:url(node_modules/@fontsource/bodoni-moda/files/bodoni-moda-latin-400-italic.woff2)}
@font-face{font-family:"Bodoni";font-weight:500;font-style:italic;src:url(node_modules/@fontsource/bodoni-moda/files/bodoni-moda-latin-500-italic.woff2)}
@font-face{font-family:"Bodoni";font-weight:700;src:url(node_modules/@fontsource/bodoni-moda/files/bodoni-moda-latin-700-normal.woff2)}
</style>
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-kr/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-kr/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/montserrat/500.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;-webkit-font-smoothing:antialiased}
section{width:1080px;height:1920px;position:relative;overflow:hidden}
.shade{position:absolute;left:0;right:0;bottom:0;height:900px;background:linear-gradient(to bottom,transparent,rgba(24,18,14,.30) 40%,rgba(24,18,14,.55))}
.sh{text-shadow:0 1px 3px rgba(0,0,0,.5),0 0 26px rgba(0,0,0,.3)}
.sh2{text-shadow:0 1px 3px rgba(0,0,0,.45),0 0 30px rgba(0,0,0,.4),0 0 60px rgba(0,0,0,.2)}
.blk{position:absolute;left:84px;right:84px;color:#fff}
.q{font-family:"Noto Serif KR";font-weight:500;font-size:38px;letter-spacing:-.01em;opacity:.92;display:flex;align-items:baseline;gap:18px}
.q b{font-family:Bodoni;font-style:italic;font-weight:500;font-size:64px;line-height:.6}
.a{font-family:"Noto Serif KR";font-weight:700;font-size:62px;line-height:1.32;letter-spacing:-.02em;margin-top:26px}
.rule{width:64px;height:2px;background:#fff;margin:30px 0 0}
.kick{font-family:Montserrat;font-weight:500;font-size:26px;letter-spacing:.42em}
</style></head><body>

<!-- G1 오프닝: 인터뷰 타이틀 + 이름 자막 -->
<section id="title"><div class="shade"></div>
  <div class="blk sh" style="top:1215px">
    <div class="kick">HARU · 7:50 AM</div>
    <div style="font-family:Bodoni;font-style:italic;font-weight:400;font-size:136px;line-height:.95;letter-spacing:-.02em;margin-top:22px">Beauty<br>Secrets</div>
    <div style="font-family:'Noto Serif KR';font-weight:500;font-size:36px;margin-top:30px;opacity:.95">출근 10분 전, 하루의 아침</div>
  </div></section>

<!-- G2 Q1 (앰플·손 아래로) -->
<section id="qa1"><div class="shade"></div>
  <div class="blk sh" style="top:1440px">
    <div class="q"><b>Q.</b>아침에 제일 먼저 손이 가는 건?</div>
    <div class="a">고민 없이, 이거요.</div>
  </div></section>

<!-- G3 챕터 넘버 + 대답 -->
<section id="step"><div class="shade"></div>
  <div class="blk sh" style="top:1240px">
    <div style="font-family:Bodoni;font-weight:400;font-size:30px;letter-spacing:.3em">N<sup style="font-size:.6em">o</sup>. 01</div>
    <div class="a" style="margin-top:20px">한 방울이면 충분해요.<br><span style="font-weight:500;font-size:44px">물처럼 그냥 스며들거든요.</span></div>
  </div></section>

<!-- G4 Q2 -->
<section id="qa2"><div class="shade"></div>
  <div class="blk sh" style="top:1290px">
    <div class="q"><b>Q.</b>피부 비결이 뭐예요?</div>
    <div class="a">톡톡, 두 번.<br>그게 끝이에요.</div>
  </div></section>

<!-- G5 제품 크레딧 (화보 캡션처럼, 병 위 여백) -->
<section id="credit">
  <div class="sh2" style="position:absolute;left:0;right:0;top:250px;text-align:center;color:#fff">
    <div class="kick" style="margin-right:-.42em">ON HER VANITY</div>
    <div style="font-family:Bodoni;font-weight:400;font-size:118px;letter-spacing:.12em;margin:18px -.12em 0 0;line-height:1">MULGYUL</div>
    <div style="font-family:'Noto Serif KR';font-weight:500;font-size:36px;margin-top:22px">물결 수분 앰플 · 30ml</div>
  </div></section>

<!-- G6 Q3 -->
<section id="qa3"><div class="shade"></div>
  <div class="blk sh" style="top:1290px">
    <div class="q"><b>Q.</b>오늘 피부, 몇 점이에요?</div>
    <div class="a">음… 백 점?</div>
  </div></section>

<!-- 엔딩: 흰 화보 페이지 -->
<section id="endlogo" style="background:radial-gradient(ellipse 85% 42% at 50% 47%,rgba(255,252,248,.9),rgba(255,252,248,.55) 70%,rgba(255,252,248,.25))">
  <div style="position:absolute;left:0;right:0;top:690px;text-align:center;color:#1d1a17">
    <div style="font-family:Bodoni;font-style:italic;font-size:44px;color:#5d554d">Haru's Beauty Secrets</div>
    <div style="width:64px;height:2px;background:#1d1a17;margin:36px auto"></div>
    <div style="font-family:Bodoni;font-weight:400;font-size:176px;letter-spacing:.12em;margin-right:-.12em;line-height:1">MULGYUL</div>
    <div style="font-family:'Noto Serif KR';font-weight:700;font-size:46px;margin-top:40px">물처럼 가볍게, 하루 종일 촉촉하게</div>
    <div class="kick" style="margin-top:30px;color:#7a6f64;margin-right:-.42em">HYDRO AMPOULE</div>
  </div>
</section>
<script>/* 질문만 있는 버전(q1~q3): 대답 전에 먼저 띄움 */
[["qa1","q1"],["qa2","q2"],["qa3","q3"]].forEach(([a,q])=>{const c=document.getElementById(a).cloneNode(true);c.id=q;c.querySelector(".a").style.visibility="hidden";document.getElementById(a).before(c);});</script>
</body></html>
